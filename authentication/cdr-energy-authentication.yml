notes: >-
  The mechanical derive pass (derive-authentication.py) found nothing: none of the six Consumer Data
  Standards OpenAPI documents declares components.securitySchemes. That is not an absence of a
  security model - the CDR keeps its security model in a separate normative Security Profile that all
  six APIs inherit, which is why the specs carry Authorization, x-fapi-auth-date,
  x-fapi-customer-ip-address and x-cds-client-headers request headers but no scheme objects. This
  profile was read from the published Security Profile section of the standards and from the CDR
  Register's live OpenID Provider metadata.
