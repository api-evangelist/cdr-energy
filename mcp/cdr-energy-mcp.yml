searched:
  date: '2026-07-27'
  result: none
  detail: >-
    No official or community MCP server exists for the Consumer Data Right. Neither the Data Standards
    Body (ConsumerDataStandardsAustralia) nor the ACCC (ConsumerDataRight) GitHub organisation
    publishes one, there is no @cds-au MCP package on npm, and no CDR entry appears in the MCP
    registries. No /.well-known/oauth-protected-resource or MCP endpoint responded on any CDR host.
notes: >-
  This is a derived candidate, not a published server. Only the unauthenticated slice of the CDR is a
  realistic MCP surface today: energy product reference data and ecosystem discovery, both of which
  answer anonymously in production. The consumer-data operations are deliberately excluded from the
  candidate tool list - they require ACCC accreditation, mutual TLS with a CDR-issued client
  certificate, and an explicit, revocable consumer consent, which is not a contract an agent can
  satisfy on its own behalf and should not be papered over with a tool definition.
