apis:
- aid: cdr-energy:cdr-register-api
  name: CDR Register API
  description: The ACCC-operated Consumer Data Right Register, the ecosystem's source of truth for who is allowed
    to participate. Unauthenticated endpoints return the energy data holder brand summary (84 brands with their
    live public base URIs), data holder statuses, accredited data recipients and software product statuses; they
    were all served anonymously over the open internet on 2026-07-27 with only an x-v version header. Authenticated
    endpoints issue Software Statement Assertions to accredited data recipients using mutual TLS and private_key_jwt
    client credentials against the Register's own OpenID Provider.
  humanURL: https://consumerdatastandardsaustralia.github.io/standards/#cdr-register-api-schemas
