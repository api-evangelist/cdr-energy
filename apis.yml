url: https://raw.githubusercontent.com/api-evangelist/cdr-energy/refs/heads/main/apis.yml
name: Consumer Data Right (Energy)
kind: company
description: 'The Consumer Data Right (CDR) is Australia''s statutory consumer data-sharing regime, created under
  Part IVD of the Competition and Consumer Act 2010 and extended from banking into electricity by the Consumer Data
  Right (Energy Sector) Designation 2020. It is run by three bodies: the ACCC as lead regulator and operator of
  the CDR Register, the OAIC as privacy regulator, and the Treasury Data Standards Body, which writes the binding
  Consumer Data Standards. In energy the regime obliges electricity retailers to expose plans, accounts, billing,
  invoices, payment schedules, concessions, service points, interval usage and DER data through one identical, versioned
  API contract, with AEMO acting as the Secondary Data Holder gateway for NMI standing data, metering data and the
  DER register. Unlike almost every other energy-sector data mandate, this one is verifiably implemented rather
  than merely announced: the public CDR Register listed 84 energy data holder brands with live public base URIs
  when probed on 2026-07-27, and 53 of those base URIs returned standards-conformant product data anonymously on
  the first request. Its API posture is a clean two-speed split — genuinely open, unauthenticated market data (retail
  plan and tariff reference data, plus the participant register itself) sitting alongside consumer data that is
  closed behind ACCC accreditation, mutual TLS, FAPI-grade OAuth 2.0 / OpenID Connect and explicit, revocable consumer
  consent. Home market Australia.'
image: https://raw.githubusercontent.com/ConsumerDataRight/mock-data-holder/main/Assets/cdr-logo.png
