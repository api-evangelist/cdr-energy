- aid: cdr-energy:cdr-common-api
  name: CDR Common API
  description: The cross-sector endpoints every CDR data holder must expose regardless of industry — GET /common/customer
    and /common/customer/detail for the consented customer's identity, and the unauthenticated /discovery/status
    and /discovery/outages endpoints that let the ecosystem see whether a data holder is up and when it plans to
    be down. The discovery pair is a rare example of a regulator mandating a public status API.
  humanURL: https://consumerdatastandardsaustralia.github.io/standards/#cdr-common-api-schemas
  tags:
  - Common
  - Customer
  - Status
  - Discovery
  properties:
  - type: OpenAPI
    url: openapi/cdr-common-openapi.json
  - type: APIReference
    url: https://consumerdatastandardsaustralia.github.io/standards/#cdr-common-api-schemas
  - type: Overlay
    url: overlays/cdr-energy-common-overlay.yaml
  - type: StatusPage
    url: https://consumerdatastandardsaustralia.github.io/standards/#cdr-common-api-schemas
- aid: cdr-energy:cdr-dynamic-client-registration-api
  name: CDR Dynamic Client Registration API
  description: The onboarding contract. Rather than a developer portal issuing keys, an accredited data recipient
    presents a Software Statement Assertion obtained from the CDR Register and self-registers with each data holder
    over mutual TLS, then manages or deletes that registration. This is how a developer actually "gets keys" in
    the CDR — machine-to-machine, gated on accreditation, with no human approval step at the data holder.
  humanURL: https://consumerdatastandardsaustralia.github.io/standards/#cdr-dynamic-client-registration-api-schemas
  tags:
  - Onboarding
  - Registration
  - OAuth
  - Accreditation
  properties:
  - type: OpenAPI
    url: openapi/cdr-dcr-openapi.json
  - type: APIReference
    url: https://consumerdatastandardsaustralia.github.io/standards/#cdr-dynamic-client-registration-api-schemas
  - type: Overlay
    url: overlays/cdr-energy-dcr-overlay.yaml
- aid: cdr-energy:cdr-admin-api
  name: CDR Admin API
  description: The mandated reporting surface every data holder must expose to the ACCC — GET /admin/metrics returns
    availability, performance, invocation, error and rejection statistics, and POST /admin/register/metadata forces
    a metadata refresh. A regulator that requires the industry to publish its own operational telemetry through
    an API is unusual, and it is the mechanism that makes CDR compliance measurable rather than self-declared.
  humanURL: https://consumerdatastandardsaustralia.github.io/standards/#cdr-admin-api-schemas
  tags:
  - Admin
  - Metrics
  - Reporting
  - Compliance
  properties:
  - type: OpenAPI
    url: openapi/cdr-admin-openapi.json
  - type: APIReference
    url: https://consumerdatastandardsaustralia.github.io/standards/#cdr-admin-api-schemas
  - type: Overlay
    url: overlays/cdr-energy-admin-overlay.yaml
