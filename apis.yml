- aid: cdr-energy:cdr-energy-api
  name: CDR Energy API
  description: The mandated energy data contract that every designated Australian electricity retailer must implement
    identically. Eighteen paths covering generic plan reference data, electricity service points, interval usage,
    distributed energy resources, accounts, balances, invoices, billing, payment schedules and concessions. The
    two /energy/plans endpoints are public product reference data and require no authentication; every other endpoint
    requires an accredited data recipient, mutual TLS and a consumer-authorised OAuth 2.0 / OpenID Connect token.
    There is no single base URL — each of the 84 registered energy data holder brands publishes its own base URI
    through the CDR Register, and 53 of them answered GET /cds-au/v1/energy/plans anonymously when probed on 2026-07-27.
  humanURL: https://consumerdatastandardsaustralia.github.io/standards/#cdr-energy-api-schemas
