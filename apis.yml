- aid: cdr-energy:cdr-energy-secondary-data-holder-api
  name: CDR Energy Secondary Data Holder API
  description: The gateway contract AEMO implements as the CDR Secondary Data Holder for energy. Retailers are the
    primary data holders for the customer relationship, but the physical data — NMI standing data, meter and interval
    usage records, and the distributed energy resources register — lives with AEMO, so the standards define a separate
    six-operation server-to-server API that retailers call on the consumer's behalf. This is the piece of machinery
    that has no banking equivalent, and it is why energy needed a shared-responsibility model rather than a straight
    copy of the banking contract.
  humanURL: https://consumerdatastandardsaustralia.github.io/standards/#cdr-energy-secondary-data-holder-api-schemas
  tags:
  - Energy
  - AEMO
  - Metering
  - DER
  - Gateway
