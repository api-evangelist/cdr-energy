generated: '2026-07-27'
method: searched
source: https://cdrsandbox.gov.au/ and the ConsumerDataRight / ConsumerDataStandardsAustralia GitHub organisations
summary: >-
  The CDR has an unusually complete test surface for a regulatory regime: a government-hosted sandbox
  operated by the ACCC, a full set of open-source mock participants you can run locally (register,
  data holder, energy data holder, data recipient, authorisation server), a test-data generator CLI,
  a published conformance test-case catalogue, and a public Postman workspace with ready-made DSB
  Banking and DSB Energy environments. There are no "test card numbers" style magic values - the CDR
  equivalent is manufactured test data generated by the testdata CLI and the test certificates issued
  to sandbox participants.
hosted_sandbox:
  name: CDR Sandbox
  url: https://cdrsandbox.gov.au/
  operator: ACCC
  cost: free (provided on a complimentary, non-commercial basis)
  status: live (HTTP 200 on 2026-07-27)
  description: >-
    A hosted deployment of the CDR Mock Solutions. Signing up as a Sandbox participant lets you
    register test software products, interact with the hosted mock register / data holder / data
    recipient, discover other participants' test solutions and arrange interactions between them.
  caveat: >-
    Explicitly not an exact replica of production - it conforms to the Consumer Data Standards but
    infrastructure and technology-stack differences exist.
  repository: https://github.com/ConsumerDataRight/sandbox
  support: https://github.com/ConsumerDataRight/sandbox/issues
  knowledge_base: https://consumerdataright.atlassian.net/wiki/spaces/PT/overview
local_mock_participants:
- name: Mock Data Holder (Energy)
  language: csharp
  url: https://github.com/ConsumerDataRight/mock-data-holder-energy
  role: energy data holder
  operator: ACCC
- name: Mock Data Holder
  language: csharp
  url: https://github.com/ConsumerDataRight/mock-data-holder
  role: banking data holder
  operator: ACCC
- name: Mock Register
  language: csharp
  url: https://github.com/ConsumerDataRight/mock-register
  role: CDR Register
  operator: ACCC
- name: Mock Data Recipient
  language: csharp
  url: https://github.com/ConsumerDataRight/mock-data-recipient
  role: accredited data recipient software product
  operator: ACCC
- name: Authorisation Server
  language: csharp
  url: https://github.com/ConsumerDataRight/authorisation-server
  role: FAPI 1.0 Advanced compliant OpenID Provider
  operator: ACCC
- name: Mock Data Holder (Java)
  language: java
  url: https://github.com/ConsumerDataStandardsAustralia/mock-data-holder-java
  operator: Data Standards Body
- name: Mock Data Holder (NodeJS)
  language: typescript
  url: https://github.com/ConsumerDataStandardsAustralia/mock-data-holder-nodejs
  operator: Data Standards Body
  note: The DSB Postman sample environments are built to work against this implementation.
- name: ADR Gateway ("Dr G")
  language: typescript
  url: https://github.com/ConsumerDataStandardsAustralia/ADR-Gateway
  role: data recipient gateway, handles the boilerplate ADR side of the ecosystem
  operator: Data Standards Body
test_data:
  generator: '@cds-au/testdata'
  install: npm install -g @cds-au/testdata
  source_code: https://github.com/ConsumerDataStandardsAustralia/testdata-cli
  description: >-
    Manufactures standards-conformant energy and banking payloads (customers, energy accounts,
    service points, interval usage, DER, plans) to seed a mock data holder. The CDR publishes no
    fixed magic test identifiers; test data is generated, not enumerated.
conformance_testing:
  test_case_catalogue: https://consumerdatastandardsaustralia.github.io/standards-testing/
  repository: https://github.com/ConsumerDataStandardsAustralia/standards-testing
  postman_workspace: https://www.postman.com/winter-shadow-541400/workspace/dsb-schema-tests
  postman_repository: https://github.com/ConsumerDataStandardsAustralia/dsb-postman
  postman_environments:
  - DSB Banking
  - DSB Energy
  note: >-
    Test cases are identified with codes such as T.EAR.0002 and are cross-linked between the Postman
    collections and the published test documentation.
production_open_surface:
  note: >-
    Separate from any sandbox, part of the CDR Energy contract is genuinely open in production. The
    two /energy/plans endpoints and the Common /discovery/status and /discovery/outages endpoints
    require no authentication, so they can be called directly against any registered data holder's
    publicBaseUri. On 2026-07-27, 53 of the 84 registered energy brands answered
    GET /cds-au/v1/energy/plans anonymously.
  discovery: https://api.cdr.gov.au/cdr-register/v1/energy/data-holders/brands/summary
  worked_example: examples/cdr-energy-plans-response-example.json
