docs: https://consumerdatastandardsaustralia.github.io/standards/#cdr-energy-api-schemas
summary: >-
  Derived from the $ref graph and the id-bearing fields in the Consumer Data Standards energy schemas.
  The energy model has a distinctive split that banking does not: the commercial entities (customer,
  account, plan, invoice, billing, concession, payment schedule) belong to the retailer as primary
  data holder, while the physical entities (service point, meter, register, DER) belong to AEMO as the
  secondary data holder and are fetched through the shared-responsibility Secondary Data Holder API.
  The service point is the join between the two halves.
