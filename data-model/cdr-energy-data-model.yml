identifier_semantics:
  see: conventions/cdr-energy-conventions.yml
  rules:
  - IDs are arbitrary and unparseable; the field name `id` is never used.
  - IDs are pairwise per data recipient software product and per authorising customer, so they cannot be correlated across recipients.
  - The NMI (nationalMeteringId) is the one meaningful natural key in the model, and it belongs to the AEMO/physical half.
shared_responsibility:
  note: >-
    Service point, usage and DER data are requested by the accredited data recipient from the
    retailer, and the retailer in turn calls AEMO's Secondary Data Holder API with the
    x-cds-arrangement header. The recipient never talks to AEMO directly.
  primary_spec: openapi/cdr-energy-openapi.json
  secondary_spec: openapi/cdr-energy-sdh-openapi.json
