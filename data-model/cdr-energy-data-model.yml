  api: openapi/cdr-common-openapi.json
  schemas: [CommonPerson, CommonPersonDetailV2, CommonOrganisation, CommonOrganisationDetailV2]
  operations: [getCustomer, getCustomerDetail]
  id_field: null
  note: The consented customer. Not addressable by id; there is exactly one per consent.
