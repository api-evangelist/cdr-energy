docs: https://consumerdatastandardsaustralia.github.io/standards/#error-codes
format: cdr-error-code-registry
rfc9457: false
notes: 'The Consumer Data Standards publish a normative, machine-readable error code registry with URN-style
  codes rather than RFC 9457 problem+json. Every error is returned in the ResponseErrorListV2 envelope
  - { "errors": [ { "code", "title", "detail", "meta" } ] } - with application/json as the media type.
  Standardised error codes became mandatory from 1 November 2022, and from May 2025 data holders must
  report on all applicable error codes through GET /admin/metrics. The codes below were read from the
  published registry; the source_operations bindings were derived from the 4xx/5xx response descriptions
  in this repo''s six OpenAPI documents, which link each response to its mandated error codes.'
envelope:
  schema: ResponseErrorListV2
  media_type: application/json
  shape: '{ "errors": [ { "code": "urn:au-cds:error:...", "title": "...", "detail": "...", "meta": { ...
    } } ] }'
  required:
  - errors
  fields:
    code: The standardised URN error code, or an application-specific code where no standard code applies.
    title: Short human-readable summary, matching the registry title.
    detail: Error-specific detail. The registry states what SHOULD be placed here per code (field name,
      header name, resource ID, arrangement ID, maximum page count).
    meta: Optional additional machine-readable context.
extensibility: Application-specific error codes MAY be supplied in the code field where no standardised
  code applies. From 1 November 2022 participants MAY deprecate any custom error codes they previously
  defined.
