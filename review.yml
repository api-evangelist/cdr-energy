actions:
  apisYmlCreated: true
  openapiHarvested: true
  specsCount: 6
  fabricated: none
  omissions: >-
    No per-retailer implementation was profiled here; the 84 data holder brands are the industry, not
    this organization. AEMO already exists as all/aemo and was not duplicated. Banking, non-bank lending
    and telco CDS specs were deliberately left unharvested as out of scope.
