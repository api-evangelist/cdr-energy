notes: >-
  The Consumer Data Right has no single API host - the CDR Register (api.cdr.gov.au) is the only
  centrally operated API host, and every data holder runs its own. The Register's OpenID Provider
  discovery document is published at a non-root path (/idp/.well-known/openid-configuration) rather
  than at the host root, so a root-level probe misses it. Both live documents below were fetched
  anonymously and saved verbatim.
